[build]
  command = "npm run build"
  publish = "build"

# Netlify production proxy for backend API.
# Replace with your deployed backend origin (Render/Railway/etc).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_DOMAIN/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
